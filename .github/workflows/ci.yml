name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Navigation core (JavaScript)
        run: npm test
      - name: Reconstruction-to-navigation pipeline (Python, against ground truth)
        run: |
          pip install -r navkit/requirements.txt
          npm run test:pipeline
